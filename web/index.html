<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SafeGate Pro - Multi-Surveillance</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <header>
        <div class="logo">
            <i class="fas fa-shield-halved logo-icon"></i>
            <span class="logo-text">Safe<strong>Gate</strong> <small>MULTI-VIEW</small></span>
        </div>
        <div class="status-container">
            <div class="status"><span class="dot live"></span><span>MONITORING ACTIF</span></div>
            <div class="server-info">RPi-5 | Schneider-Net</div>
        </div>
    </header>

    <main>
        <div class="kpi-bar">
            <div class="kpi-card">
                <span class="kpi-value" id="kpi-today">0</span>
                <span class="kpi-label">Infractions aujourd'hui</span>
            </div>
            <div class="kpi-divider"></div>
            <div class="kpi-card">
                <span class="kpi-value" id="kpi-yesterday">0</span>
                <span class="kpi-label">Hier</span>
            </div>
        </div>

        <section class="monitoring-area">
            <div class="section-header">
                <div class="section-title"><i class="fas fa-th-large"></i> Grille de Surveillance</div>
                <div id="status-badge" class="badge-safe">SÉCURISÉ</div>
            </div>
            
            <div class="monitor-grid" id="monitor-grid">
                </div>
        </section>

        <section class="history-section">
            <div class="section-header">
                <div class="section-title"><i class="fas fa-list-ul"></i> Journal des événements</div>
                <span class="badge" id="count-badge">0 alerte(s)</span>
            </div>
            <div class="history-list" id="history-list"></div>
        </section>
    </main>

    <div class="modal-overlay" id="modal" onclick="closeModal()">
        <div class="modal-box" onclick="event.stopPropagation()">
            <div class="modal-header">
                <span class="modal-title">Analyse de l'infraction</span>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="modal-photo-area"><img id="modal-img" src="" /></div>
                <div class="modal-info">
                    <div class="info-item" id="modal-id"></div>
                    <div class="info-item" id="modal-date"></div>
                    <div class="info-item" id="modal-epi"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">
        <i class="fas fa-exclamation-triangle"></i>
        <span id="toast-msg"></span>
    </div>

    <script src="app.js"></script>
</body>
</html>
